<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocSearch Lite - AI RAG Pipeline</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); }
        .stream-cursor::after { content: '|'; animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        pre { background: #1e293b; color: #f8fafc; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; font-size: 0.875rem; }
    </style>
</head>
<body className="h-screen flex flex-col">
    <!-- Header -->
    <header class="border-b bg-white/80 backdrop-blur-md sticky top-0 z-10 px-6 py-4 flex items-center justify-between">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center text-white font-bold">D</div>
            <h1 class="text-xl font-bold tracking-tight text-slate-800">DocSearch <span class="text-indigo-600">Model Test</span></h1>
        </div>
        <div id="status" class="text-xs font-medium text-slate-500 bg-slate-100 px-2 py-1 rounded-full">Ready</div>
    </header>

    <!-- Chat Area -->
    <main id="chat-container" class="flex-1 overflow-y-auto p-4 md:p-8 space-y-6 max-w-4xl mx-auto w-full">
        <div class="text-center py-20">
            <h2 class="text-2xl font-bold text-slate-700">Thử nghiệm RAG Pipeline</h2>
            <p class="text-slate-500 mt-2">Streaming + Reranking + Local LLM</p>
        </div>
    </main>

    <!-- Input Area -->
    <footer class="border-t bg-white p-4">
        <div class="max-w-4xl mx-auto flex gap-3">
            <textarea id="input" placeholder="Hỏi về tài liệu..." class="flex-1 border border-slate-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 resize-none h-14"></textarea>
            <button id="send-btn" class="bg-indigo-600 text-white px-6 rounded-xl font-semibold hover:bg-indigo-700 transition-all disabled:opacity-50">
                Gửi
            </button>
        </div>
    </footer>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const input = document.getElementById('input');
        const sendBtn = document.getElementById('send-btn');
        const status = document.getElementById('status');

        async function handleSearch() {
            const query = input.value.trim();
            if (!query) return;

            input.value = '';
            status.textContent = 'Processing...';
            
            // Add User Message
            addMessage(query, 'user');

            // Add Assistant Message Placeholder
            const assistantMsgDiv = addMessage('', 'assistant');
            const contentDiv = assistantMsgDiv.querySelector('.content');
            contentDiv.classList.add('stream-cursor');

            try {
                const response = await fetch('/api/search/stream', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: query, history: [] })
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let fullContent = '';

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n');

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const data = JSON.parse(line.slice(6));
                            if (data.type === 'token') {
                                fullContent += data.token;
                                contentDiv.innerText = fullContent;
                                chatContainer.scrollTop = chatContainer.scrollHeight;
                            } else if (data.type === 'metadata') {
                                renderSources(assistantMsgDiv, data.sources);
                            } else if (data.type === 'done') {
                                contentDiv.classList.remove('stream-cursor');
                                status.textContent = 'Ready';
                            }
                        }
                    }
                }
            } catch (err) {
                console.error(err);
                contentDiv.innerText = 'Lỗi: ' + err.message;
            }
        }

        function addMessage(text, role) {
            const div = document.createElement('div');
            div.className = `flex ${role === 'user' ? 'justify-end' : 'justify-start'}`;
            div.innerHTML = `
                <div class="max-w-[85%] rounded-2xl px-4 py-3 shadow-sm ${role === 'user' ? 'bg-indigo-600 text-white' : 'bg-white border border-slate-200'}">
                    <div class="content whitespace-pre-wrap text-sm">${text}</div>
                    <div class="sources mt-3 pt-3 border-t border-slate-100 hidden">
                        <p class="text-[10px] font-bold text-slate-400 uppercase mb-2">Nguồn trích dẫn</p>
                        <div class="flex flex-wrap gap-2 chips"></div>
                    </div>
                </div>
            `;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return div;
        }

        function renderSources(msgDiv, sources) {
            if (!sources || sources.length === 0) return;
            const sourcesDiv = msgDiv.querySelector('.sources');
            const chipsDiv = msgDiv.querySelector('.chips');
            sourcesDiv.classList.remove('hidden');
            chipsDiv.innerHTML = sources.map(s => `
                <span class="px-2 py-0.5 bg-slate-100 rounded text-[10px] font-medium text-slate-600 border border-slate-200">
                    ${s.file} ${s.page ? '(Trang ' + s.page + ')' : ''}
                </span>
            `).join('');
        }

        sendBtn.addEventListener('click', handleSearch);
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSearch();
            }
        });
    </script>
</body>
</html>
